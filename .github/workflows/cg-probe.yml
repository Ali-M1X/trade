name: cg-probe
# temporary: why /coins/markets answers 429 from Actions (2026-11-14); removed after
on:
  push:
    branches: [claude/status-panel]
    paths: [".github/workflows/cg-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      K: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - run: |
          B=https://api.coingecko.com/api/v3
          q="vs_currency=usd&order=market_cap_desc&per_page=250"
          for p in 1 2 3 9; do
            echo "== key page $p"; curl -s -H "x-cg-demo-api-key: $K" -o b.txt -w "%{http_code}\n" "$B/coins/markets?$q&page=$p"; head -c 300 b.txt | grep -v '^\[{' ; echo; sleep 3
          done
          echo "== key ping"; curl -s -H "x-cg-demo-api-key: $K" "$B/ping"; echo
          echo "== key usage"; curl -s -H "x-cg-demo-api-key: $K" "$B/key" | head -c 400; echo
          for p in 1 2; do
            echo "== nokey page $p"; curl -s -o b.txt -w "%{http_code}\n" "$B/coins/markets?$q&page=$p"; head -c 300 b.txt | grep -v '^\[{'; echo; sleep 3
          done
