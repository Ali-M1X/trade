name: news-worker

# Deploys the fast news path (cloudflare/news-worker) to Cloudflare Workers: it checks Binance
# and OKX announcements every minute and alerts in Telegram. Needs the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (plus the Telegram ones the agent uses);
# without them this workflow only runs the worker tests.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/news-alerts]   # TEMP: the PR branch deploys once to check the setup
    paths:
      - "cloudflare/news-worker/**"
      - "src/agent/news/rules.json"
      - "tests/fixtures/news_titles.json"
      - ".github/workflows/news-worker.yml"

permissions:
  contents: read

concurrency:
  group: news-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/news-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.148.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set: tests only, nothing deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            # tolerate a pasted URL around the account id, or "Bearer " / spaces around the token
            acct=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-fA-F]{32}' | head -1)
            tok=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]' | sed 's/^Bearer//I')
            echo "::add-mask::$acct"
            echo "::add-mask::$tok"
            echo "account id: ${#CLOUDFLARE_ACCOUNT_ID} chars as saved, 32-hex id found: $([ -n "$acct" ] && echo yes || echo no)"
            echo "token: ${#CLOUDFLARE_API_TOKEN} chars as saved, ${#tok} after cleanup, whitespace inside: $(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -q '[[:space:]]' && echo yes || echo no)"
            echo "CLOUDFLARE_ACCOUNT_ID=$acct" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check Cloudflare access
        if: steps.secrets.outputs.ok == 'true'
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);
                console.log(j.success ? "ok" : "FAILED", JSON.stringify(j.errors||[]), JSON.stringify(j.messages||[]))})'; }
          echo "token verify: $(api /user/tokens/verify)"
          echo "account: $(api /accounts/$CLOUDFLARE_ACCOUNT_ID)"
          echo "kv list: $(api /accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces)"
          echo "workers subdomain: $(api /accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain)"
          echo "account id length: ${#CLOUDFLARE_ACCOUNT_ID}"
      - name: KV namespace (create once)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          find_id() { $WRANGLER kv namespace list 2>/dev/null | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              const i = s.indexOf("["); const list = i < 0 ? [] : JSON.parse(s.slice(i));
              const ns = list.find(n => /NEWS_KV$/.test(n.title)); if (ns) console.log(ns.id); });'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            $WRANGLER kv namespace create NEWS_KV
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "could not find or create the NEWS_KV namespace"; exit 1; }
          sed -i "s/__KV_ID__/$id/" wrangler.toml
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: $WRANGLER deploy
      - name: Telegram secrets
        if: steps.secrets.outputs.ok == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | $WRANGLER secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID" | $WRANGLER secret put TELEGRAM_CHAT_ID
          echo "Deployed: Binance and OKX announcements are checked every minute." >> "$GITHUB_STEP_SUMMARY"
