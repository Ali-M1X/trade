name: news-source-probe
# One-off: dump sample payloads of the news sources. Changes nothing.
on:
  push:
    branches: [claude/news-source-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump
        run: |
          d() { echo "=== $1"; curl -s -m 20 -A "Mozilla/5.0 (X11; Linux x86_64)" "$1" | head -c ${2:-2500}; echo; }
          d "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&pageNo=1&pageSize=3" 4000
          d "https://www.binance.com/bapi/composite/v1/public/cms/article/catalog/list/query?catalogId=48&pageNo=1&pageSize=3" 2500
          d "https://www.okx.com/api/v5/support/announcements?annType=announcements-new-listings" 1500
          d "https://www.okx.com/api/v5/support/announcement-types" 1500
          d "https://www.kucoin.com/_api/cms/articles?page=1&pageSize=3&category=listing&lang=en_US" 2500
          d "https://cointelegraph.com/rss" 2500
          d "https://www.theblock.co/rss.xml" 1800
          curl -s -m 20 -A "Mozilla/5.0" "https://t.me/s/binance_announcements" | grep -o 'tgme_widget_message_text[^>]*>[^<]\{0,200\}' | tail -3 || true
          curl -s -m 20 -A "Mozilla/5.0" "https://t.me/s/binance_announcements" | grep -o 'data-post="[^"]*"' | tail -3 || true
