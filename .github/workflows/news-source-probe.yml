name: news-source-probe
# One-off: which free crypto news / announcement sources answer from GitHub Actions. Changes nothing.
on:
  push:
    branches: [claude/news-source-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          probe() {
            body=$(mktemp)
            code=$(curl -s -L -o "$body" -m 20 -w "%{http_code}" -A "Mozilla/5.0 (X11; Linux x86_64)" "$1")
            size=$(wc -c < "$body")
            items=$(grep -o -i -E "<item>|<entry>|\"title\"" "$body" | wc -l)
            first=$(grep -o -i -E "<title>[^<]{5,120}</title>|\"title\": ?\"[^\"]{5,120}\"" "$body" | sed -n 2p)
            echo "| $1 | $code | $size | $items | ${first//|/ } |" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          echo "| url | http | bytes | items | sample title |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for u in \
            https://www.coindesk.com/arc/outboundfeeds/rss/ \
            https://cointelegraph.com/rss \
            https://www.theblock.co/rss.xml \
            https://decrypt.co/feed \
            https://blockworks.co/feed \
            https://bitcoinmagazine.com/.rss/full/ \
            https://thedefiant.io/api/feed \
            https://www.coinbase.com/blog/rss.xml \
            "https://cryptopanic.com/news/rss/" \
            "https://cryptopanic.com/api/developer/v2/posts/?public=true" \
            "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&pageNo=1&pageSize=5" \
            "https://www.okx.com/api/v5/support/announcements?annType=announcements-new-listings" \
            "https://www.okx.com/api/v5/support/announcements?annType=announcements-latest-announcements" \
            "https://api.bybit.com/v5/announcements/index?locale=en-US&limit=5" \
            "https://api.gateio.ws/api/v4/announcements" \
            "https://api-manager.upbit.com/api/v1/announcements?os=web&page=1&per_page=5&category=trade" \
            "https://api.coingecko.com/api/v3/search/trending" \
            "https://min-api.cryptocompare.com/data/v2/news/?lang=EN" \
            "https://www.reddit.com/r/CryptoCurrency/new.json?limit=5" \
            "https://nitter.net/binance/rss" \
            "https://rsshub.app/telegram/channel/binance_announcements" \
            "https://t.me/s/binance_announcements" \
            "https://t.me/s/WuBlockchain" \
            "https://t.me/s/tree_news_feed" \
            "https://t.me/s/whale_alert_io" \
            ; do probe "$u"; done
