name: loss-review

# Why trades lose (2026-11-01, Ali): the live systems (combo_top100, s2_top100) replayed
# 2021-2026 on the stored top-250 history, every trade followed on 1H candles
# (scripts/loss_review.py). Changes nothing live.
on:
  workflow_dispatch:
  push:
    branches: [claude/loss-review]
    paths: [".github/workflows/loss-review.yml"]

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        variant: [combo_top100, s2_top100]
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: backtest-db-u250
          path: data
          run-id: 40538875697
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: gunzip data/backtest.db.gz
      - name: Replay one year
        run: |
          next=$(( ${{ matrix.year }} + 1 ))
          trade-agent -v backtest --variant ${{ matrix.variant }} --start ${{ matrix.year }}-01-01 \
            --end ${next}-01-01 --json ${{ matrix.variant }}-${{ matrix.year }}.json 2>&1 | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: loss-${{ matrix.variant }}-${{ matrix.year }}
          path: ${{ matrix.variant }}-${{ matrix.year }}.json

  review:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: backtest-db-u250
          path: data
          run-id: 40538875697
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: gunzip data/backtest.db.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: loss-*
          path: results
          merge-multiple: true
      - name: Review
        run: |
          python scripts/long_report.py results/*.json > /dev/null
          python scripts/loss_review.py --db data/backtest.db combo_top100_joined.json s2_top100_joined.json
          cat LOSS_REVIEW.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: loss-report
          path: |
            LOSS_REVIEW.md
            LONG_BACKTEST.md
            *_joined.json
