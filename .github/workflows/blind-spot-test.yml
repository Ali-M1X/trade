name: blind-spot-test

# Blind spots of the loss review (2026-11-01, Ali): one fix at a time, then combinations (technical.avoid,
# 3 confirmations, no BREAKOUT_WATCH) on both live systems, 2021-2026, top 100, against
# combo_top100 / s2_top100 (from the loss-review run). Changes nothing live.
on:
  workflow_dispatch:
  push:
    branches: [claude/blind-spots]
    paths: [".github/workflows/blind-spot-test.yml"]

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        variant: [bs1_c_worn_s85, bs1_c_worn_s85_btc, bs1_c_strong_worn, bs1_c_all4,
                  bs2_c_cycle_worn, bs2_c_cycle_worn_strong]
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: backtest-db-u250
          path: data
          run-id: 40538875697
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: gunzip data/backtest.db.gz
      - name: Replay one year
        run: |
          next=$(( ${{ matrix.year }} + 1 ))
          trade-agent -v backtest --variant ${{ matrix.variant }} --start ${{ matrix.year }}-01-01 \
            --end ${next}-01-01 --json ${{ matrix.variant }}-${{ matrix.year }}.json 2>&1 | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: bs-${{ matrix.variant }}-${{ matrix.year }}
          path: ${{ matrix.variant }}-${{ matrix.year }}.json

  report:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: bs-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: loss-*-20*
          path: results
          merge-multiple: true
          run-id: 41325626419
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bs-*
          path: results
          merge-multiple: true
          run-id: 41328921614
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Report
        run: |
          rm -f results/*_joined.json
          python scripts/long_report.py results/*.json > /dev/null
          trade-agent backtest-robust combo_top100_joined.json bs1_*_joined.json --baseline combo_top100 --out ROBUST_S1.md
          trade-agent backtest-robust s2_top100_joined.json bs2_*_joined.json --baseline s2_top100 --out ROBUST_S2.md
          cat ROBUST_S1.md ROBUST_S2.md LONG_BACKTEST.md >> "$GITHUB_STEP_SUMMARY"
          cat ROBUST_S1.md ROBUST_S2.md
          grep -E '^### `|^\| all \|' LONG_BACKTEST.md
      - uses: actions/upload-artifact@v4
        with:
          name: bs-report
          path: |
            LONG_BACKTEST.md
            ROBUST_S1.md
            ROBUST_S2.md
