name: s1-shorts-test

# Blind spots of the loss review (2026-11-01, Ali): one fix at a time, then combinations (technical.avoid,
# 3 confirmations, no BREAKOUT_WATCH) on both live systems, 2021-2026, top 100, against
# combo_top100 / s2_top100 (from the loss-review run). Changes nothing live.
on:
  workflow_dispatch:
  push:
    branches: [claude/s1-shorts]
    paths: [".github/workflows/s1-shorts-test.yml"]

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        variant: [s1s_nostage, s1s_nostage_4h]
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: backtest-db-u250
          path: data
          run-id: 40538875697
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: gunzip data/backtest.db.gz
      - name: Replay one year
        run: |
          next=$(( ${{ matrix.year }} + 1 ))
          trade-agent -v backtest --variant ${{ matrix.variant }} --start ${{ matrix.year }}-01-01 \
            --end ${next}-01-01 --json ${{ matrix.variant }}-${{ matrix.year }}.json 2>&1 | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: s1s-${{ matrix.variant }}-${{ matrix.year }}
          path: ${{ matrix.variant }}-${{ matrix.year }}.json

  report:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: s1s-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bs-*-20*
          path: base
          merge-multiple: true
          run-id: 41335477346
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: both-both1_half-20*
          path: base
          merge-multiple: true
          run-id: 41468740379
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Report
        run: |
          cp base/bs1_c_all4-*.json base/both1_half-*.json results/
          python scripts/long_report.py results/*.json > /dev/null
          trade-agent backtest-robust bs1_c_all4_joined.json both1_half_joined.json s1s_*_joined.json --baseline bs1_c_all4 --out ROBUST_S1.md
          trade-agent backtest-robust both1_half_joined.json s1s_*_joined.json --baseline both1_half --out ROBUST_S2.md
          cat ROBUST_S1.md ROBUST_S2.md LONG_BACKTEST.md >> "$GITHUB_STEP_SUMMARY"
          cat ROBUST_S1.md ROBUST_S2.md
          grep -E '^### `|^\| all \||^\| (bull|range|bear) (long|short) \|' LONG_BACKTEST.md
          python - <<'PY'
          import glob, json
          for p in sorted(glob.glob("*_joined.json")):
              d = json.load(open(p))
              ts = [t for t in d["trades"] if t["status"] in ("sl", "breakeven", "tp3")]
              print(f"{d['variant']}: {sum(t['net_r'] * t['risk_pct'] for t in ts):+.1f}% of the account (simple sum)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s1s-report
          path: |
            LONG_BACKTEST.md
            ROBUST_S1.md
            ROBUST_S2.md
