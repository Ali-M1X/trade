name: signal-review

# Analysis (2026-10-16): every green and yellow Telegram message since the 2026-10-09 update,
# what entering at the moment of the message would have made, and results per coin.
# Changes nothing live.
on:
  workflow_dispatch:
  push:
    branches: [claude/signal-review]
    paths:
      - "scripts/signal_review.py"
      - ".github/workflows/signal-review.yml"

permissions:
  actions: read
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Live databases
        run: |
          git fetch --depth=1 origin data
          git show FETCH_HEAD:state.db.gz | gunzip > state.db
          git show FETCH_HEAD:state_s2.db.gz | gunzip > state_s2.db
      - uses: actions/download-artifact@v4
        with:
          pattern: hr-variant-*
          path: results
          merge-multiple: true
          run-id: 37902857594
          repository: Ali-M1X/trade
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/signal_review.py --since 2026-10-09T06:49:42Z --since2 2026-10-09T08:54:45Z \
            --repo ${{ github.repository }} --db1 state.db --db2 state_s2.db \
            --backtest results/ph_stage.json results/s2_trend.json
          cat signal_review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: signal-review
          path: signal_review.*
