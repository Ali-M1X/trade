name: panel-backfill

# Status panel (2026-11-14, Ali): replays both live systems from 2026-11-06 with the shadow
# book on (Watch setups followed like signals), then commits the trades to
# panel/backfill.json on the branch it ran on. Changes nothing live.
# rerun: 2026-11-14 after the CoinGecko quota fallback
on:
  workflow_dispatch:
    inputs:
      start:
        description: "replay from (YYYY-MM-DD)"
        default: "2026-11-06"
  push:
    branches: [claude/status-panel]
    paths: [".github/workflows/panel-backfill.yml"]

permissions:
  contents: write

concurrency:
  group: panel-backfill
  cancel-in-progress: true

env:
  START: ${{ inputs.start || '2026-11-06' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      # 150 days: the regime's moving averages need ~100 days of history before START
      - run: set -o pipefail; trade-agent -v backtest --fetch-only --days 150 2>&1 | grep -v " INFO .*HTTP" | tail -60
      - run: gzip -k data/backtest.db && ls -la data
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-db-panel
          path: data/backtest.db.gz
          retention-days: 7

  replay:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [combo_avoid, s2_avoid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: backtest-db-panel
          path: data
      - run: gunzip data/backtest.db.gz
      - run: |
          set -o pipefail
          trade-agent -v backtest --variant ${{ matrix.variant }} --record-watch \
            --start "$START" --json ${{ matrix.variant }}.json 2>&1 | tail -8
      - uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.variant }}
          path: ${{ matrix.variant }}.json

  commit:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: panel-*
          path: results
          merge-multiple: true
      - run: |
          set -o pipefail
          python scripts/panel_backfill.py panel/backfill.json \
            system1=results/combo_avoid.json system2=results/s2_avoid.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit panel/backfill.json
        run: |
          git config user.name trade-signal-agent
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add panel/backfill.json
          git commit -m "Panel backfill: replay from $START (confirmed + Watch)" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
