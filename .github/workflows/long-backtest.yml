name: long-backtest

# Experiment (2026-10-22): the live systems over several years, split by the price regime
# (bull / range / bear). Fetches exchange history from mid-2020 for today's top 100, replays
# each year in parallel, then joins the years per variant. Changes nothing live.
on:
  workflow_dispatch:
  push:
    branches: [claude/regime-review]
    paths: [".github/workflows/long-backtest.yml"]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: trade-agent -v backtest --fetch-only --since 2020-06-01 --top-n 100 2>&1 | grep -v " INFO .*HTTP" | tail -150
      - run: gzip -k data/backtest.db && ls -la data
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-db-long
          path: data/backtest.db.gz
          retention-days: 30

  replay:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        variant: [long_ph_stage, long_s2_trend]
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: backtest-db-long
          path: data
      - run: gunzip data/backtest.db.gz
      - name: Replay one year
        run: |
          next=$(( ${{ matrix.year }} + 1 ))
          trade-agent -v backtest --variant ${{ matrix.variant }} --start ${{ matrix.year }}-01-01 \
            --end ${next}-01-01 --json ${{ matrix.variant }}-${{ matrix.year }}.json 2>&1 | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: long-${{ matrix.variant }}-${{ matrix.year }}
          path: ${{ matrix.variant }}-${{ matrix.year }}.json

  report:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: long-*
          path: results
          merge-multiple: true
      - name: Report
        run: |
          python scripts/long_report.py results/*.json
          cat LONG_BACKTEST.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: long-report
          path: |
            LONG_BACKTEST.md
            *_joined.json
