name: universe-700-s2

# System 2 on the top 700 / $4M history of the universe-700 run, on the price regime
# (the stored history has no dominance data). Changes nothing live.
on:
  workflow_dispatch:
  push:
    branches: [claude/universe-700]
    paths: [".github/workflows/universe-700-s2.yml"]

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        variant: [u7s2_live, u7s2_vol4, u7s2_top700, u7s2_top700_vol4]
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: backtest-db-u700
          path: data
          run-id: 41649823224
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: gunzip data/backtest.db.gz
      - name: Replay one year
        run: |
          next=$(( ${{ matrix.year }} + 1 ))
          trade-agent -v backtest --variant ${{ matrix.variant }} --start ${{ matrix.year }}-01-01 \
            --end ${next}-01-01 --json ${{ matrix.variant }}-${{ matrix.year }}.json 2>&1 | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: u7b-${{ matrix.variant }}-${{ matrix.year }}
          path: ${{ matrix.variant }}-${{ matrix.year }}.json

  report:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: u7b-*
          path: results
          merge-multiple: true
      - name: Report
        run: |
          python scripts/long_report.py results/*.json > /dev/null
          trade-agent backtest-robust u7s2_*_joined.json --baseline u7s2_live --out ROBUST_S2.md
          cat ROBUST_S2.md LONG_BACKTEST.md >> "$GITHUB_STEP_SUMMARY"
          cat ROBUST_S2.md
          grep -E '^### `|^\| all \||^\| (bull|range|bear) (long|short) \|' LONG_BACKTEST.md
          python - <<'PY'
          import glob, json
          for p in sorted(glob.glob("*_joined.json")):
              d = json.load(open(p))
              ts = [t for t in d["trades"] if t["status"] in ("sl", "breakeven", "tp3")]
              coins = len({t["base"] for t in ts})
              print(f"{d['variant']}: {sum(t['net_r'] * t['risk_pct'] for t in ts):+.1f}% of the account (simple sum), {coins} coins traded")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: u7b-report
          path: |
            LONG_BACKTEST.md
            ROBUST_S2.md
            *_joined.json
