name: universe-test

# Experiment (2026-10-27): a wider universe (top 250) and a lower volume floor ($8M) against
# the live list (top 200, $10M), 2021-2026 by price regime. Changes nothing live.
on:
  workflow_dispatch:
  push:
    branches: [claude/universe-250]
    paths: [".github/workflows/universe-test.yml"]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - run: trade-agent -v backtest --fetch-only --since 2020-06-01 --top-n 250 2>&1 | grep -v " INFO .*HTTP" | tail -300
      - run: gzip -k data/backtest.db && ls -la data
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-db-u250
          path: data/backtest.db.gz
          retention-days: 30

  replay:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        variant: [combo_top200, combo_vol8, combo_top250, combo_top250_vol8, s2_top200, s2_top250_vol8]
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: backtest-db-u250
          path: data
      - run: gunzip data/backtest.db.gz
      - name: Replay one year
        run: |
          next=$(( ${{ matrix.year }} + 1 ))
          trade-agent -v backtest --variant ${{ matrix.variant }} --start ${{ matrix.year }}-01-01 \
            --end ${next}-01-01 --json ${{ matrix.variant }}-${{ matrix.year }}.json 2>&1 | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: u250-${{ matrix.variant }}-${{ matrix.year }}
          path: ${{ matrix.variant }}-${{ matrix.year }}.json

  report:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: u250-*
          path: results
          merge-multiple: true
      - name: Report
        run: |
          python scripts/long_report.py results/*.json
          trade-agent backtest-robust combo_*_joined.json --baseline combo_top200 --out ROBUST_S1.md
          trade-agent backtest-robust s2_*_joined.json --baseline s2_top200 --out ROBUST_S2.md
          cat ROBUST_S1.md ROBUST_S2.md LONG_BACKTEST.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: u250-report
          path: |
            LONG_BACKTEST.md
            ROBUST_S1.md
            ROBUST_S2.md
            *_joined.json
