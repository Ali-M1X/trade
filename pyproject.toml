[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-signal-agent"
version = "0.1.0"
description = "Deterministic crypto futures signal engine (top-down strategy) with Persian Telegram output"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4",
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trade-agent = "agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
